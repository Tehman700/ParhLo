[project]
name = "nascon-backend"
version = "0.1.0"
description = "ParhLo backend (FastAPI) — personal morning paper"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "openai>=1.50",
    "httpx>=0.27",
    "numpy>=1.26",
    "feedparser>=6.0.14",
    "trafilatura>=2.3.1",
    "psycopg[binary,pool]>=3.3.6",
    "pgvector>=0.5.1",
    "boto3>=1.43.114",
    "pyjwt[crypto]>=2.15.1",
]

[project.optional-dependencies]
# Pre-event starter modules (agent tools, RAG, ML, vision). Not deployed: keeps Vercel cold starts small.
# Enable with: uv sync --extra starter   (tests use it: uv run --extra starter pytest)
starter = ["pandas>=2.2", "scikit-learn>=1.5", "joblib>=1.4", "pypdf>=4.3", "pillow>=10.4"]
# Enable with: uv sync --extra mcp
mcp = ["mcp>=1.2"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# CI gate: real errors only (syntax errors, undefined names, unused imports/variables). Style is left to review.
select = ["E9", "F"]
